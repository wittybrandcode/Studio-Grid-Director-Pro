    <script>
      (function () {
        var OrigWebSocket = window.WebSocket;
        if (!OrigWebSocket) return;
        function GuardedWebSocket(url, protocols) {
          if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
            var dummy = new EventTarget();
            dummy.url = String(url || '');
            dummy.readyState = 1;
            dummy.protocol = String(protocols || '');
            dummy.send = function () {};
            dummy.close = function () {};
            return dummy;
          }
          return protocols !== undefined
            ? new OrigWebSocket(url, protocols)
            : new OrigWebSocket(url);
        }
        GuardedWebSocket.prototype = OrigWebSocket.prototype;
        GuardedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        GuardedWebSocket.OPEN = OrigWebSocket.OPEN;
        GuardedWebSocket.CLOSING = OrigWebSocket.CLOSING;
        GuardedWebSocket.CLOSED = OrigWebSocket.CLOSED;
        window.WebSocket = GuardedWebSocket;
      })();
    </script>
